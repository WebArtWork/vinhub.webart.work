<nav
	class="sticky top-0 z-[100] flex min-h-14 items-center bg-[var(--c-bg-secondary)] shadow px-5 max-md:fixed max-md:top-0 max-md:w-full max-md:px-3"
>
	<ul
		class="m-0 flex w-full list-none items-center gap-2 p-0 max-md:justify-between max-md:gap-0"
	>
		<li class="inline-flex items-center gap-2 max-md:flex-none">
			<a
				routerLink="/"
				class="inline-flex items-center gap-2 text-[var(--c-text-primary)] no-underline"
				[attr.aria-label]="translateService.translate('VIN Hub')()"
			>
				<img
					src="/logo.png?v=20260828-vinhub-mark"
					alt="VIN Hub"
					class="h-8 w-8 rounded"
				/>
			</a>
		</li>

		<li
			class="hidden max-md:inline-flex max-md:min-w-0 max-md:flex-1 max-md:items-center"
		>
			<span
				class="truncate text-base font-semibold"
				[translate]="displayTitle()"
			></span>
		</li>

		@for (item of navItems; track item.label) {
		<li class="inline-flex items-center max-md:hidden">
			<app-nav-icon
				[routerLink]="item.to"
				[name]="translateService.translate(item.label)()"
				[icon]="item.icon"
			/>
		</li>
		}

		<li class="mx-auto max-md:hidden"></li>

		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
			(mouseleave)="onBurgerHover(false)"
			(mouseenter)="onBurgerHover(true)"
		>
			<button
				type="button"
				class="inline-flex cursor-pointer items-center justify-center border-0 bg-transparent p-2 text-[1.375rem] leading-none text-[var(--c-text-secondary)] transition-colors hover:text-[var(--c-primary)]"
				(click)="onBurgerClick()"
				[attr.aria-label]="translateService.translate('Menu')()"
			>
				<i class="pi pi-{{ burgerIcon() }}"></i>
			</button>
		</li>
	</ul>
</nav>
