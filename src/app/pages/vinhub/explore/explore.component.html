<div class="explore-page">
	<div class="explore-page__header">
		<h1 class="explore-page__title">Explore</h1>

		<input
			pInputText
			class="explore-page__search"
			placeholder="Search make, model, title..."
			[(ngModel)]="query"
		/>
		<p-select
			class="explore-page__kind"
			placeholder="Any kind"
			[options]="kinds"
			[(ngModel)]="kind"
			[showClear]="true"
		/>

		<a
			pButton
			routerLink="/map"
			severity="secondary"
			size="small"
			class="explore-page__map-link"
		>
			Map
		</a>
	</div>

	<div class="explore-page__grid">
		@for (listing of results(); track listing._id) {
		<app-listing-card
			[listing]="listing"
			(open)="openListing(listing._id)"
		/>
		} @empty {
		<p class="explore-page__empty">No listings match your search.</p>
		}
	</div>
</div>
