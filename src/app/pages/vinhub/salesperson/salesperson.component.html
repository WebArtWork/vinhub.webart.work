@if (salesperson(); as salesperson) {
<div class="salesperson-page">
	<app-salesperson-view [salesperson]="salesperson" />

	<section class="salesperson-page__section">
		<h2 translate>Comments</h2>
		<app-comments-view
			targetType="salesperson"
			[targetId]="salesperson._id"
		/>
	</section>
</div>
} @else {
<p translate>Salesperson not found.</p>
}
