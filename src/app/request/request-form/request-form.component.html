<form (submit)="wFormSubmit(); $event.preventDefault()" class="request-form">
	<p-select class="w-full" placeholder="Kind" [options]="kinds" [formField]="requestForm.kind" />
	<input pInputText class="w-full" placeholder="Your name" [formField]="requestForm.clientName" />
	<input pInputText class="w-full" placeholder="Your email" [formField]="requestForm.clientEmail" />
	<input pInputText class="w-full" placeholder="Your phone" [formField]="requestForm.clientPhone" />
	<textarea pTextarea class="w-full" placeholder="Message" [formField]="requestForm.message"></textarea>

	<div class="request-form__actions">
		<button pButton type="submit" [disabled]="isSubmitDisabled()"><span translate>Send request</span></button>
	</div>
</form>
