@switch (status()) {
	@case ('success') {
		<div class="lead-form lead-form--success">
			<p>Thanks! We got your message and will be in touch soon.</p>
		</div>
	}
	@default {
		<form class="lead-form" novalidate #leadForm="ngForm" (ngSubmit)="submit(leadForm)">
			<div class="lead-form__field">
				<label>Name</label>
				<input
					#nameInput
					pInputText
					type="text"
					name="name"
					required
					[ngModel]="name()"
					(ngModelChange)="name.set($event)"
				/>
			</div>

			<div class="lead-form__field">
				<label>Email or phone</label>
				<input
					pInputText
					type="text"
					name="contact"
					required
					[ngModel]="contact()"
					(ngModelChange)="contact.set($event)"
				/>
			</div>

			<div class="lead-form__field">
				<label>Message</label>
				<textarea
					pTextarea
					rows="3"
					name="message"
					[ngModel]="message()"
					(ngModelChange)="message.set($event)"
				></textarea>
			</div>

			@if (status() === 'error') {
				<p class="lead-form__error">Something went wrong — please try again.</p>
			}

			<button pButton type="submit" [disabled]="leadForm.invalid || status() === 'sending'">
				{{ submitLabel() || 'Send' }}
			</button>
		</form>
	}
}
